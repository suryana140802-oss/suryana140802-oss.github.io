<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipz Manga - Official Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0B1120;
            color: #F8FAFC;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            max-width: 480px;
            backdrop-filter: blur(12px);
        }
        h1 { margin: 0 0 10px; color: #38BDF8; font-size: 28px; }
        p { color: #94A3B8; font-size: 15px; line-height: 1.6; }
        a.btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #0284C7, #0EA5E9);
            color: white;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 600;
        }
        .meta { margin-top: 25px; font-size: 12px; color: #64748B; }
        .meta a { color: #38BDF8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Flipz Manga</h1>
